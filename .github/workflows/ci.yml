name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - Makefile
              - .github/workflows/ci.yml
            frontend:
              - *shared
              - src/**
              - public/**
              - index.html
              - package.json
              - package-lock.json
              - tsconfig.json
              - tsconfig.node.json
              - vite.config.ts
              - vitest.config.ts
              - tailwind.config.js
              - postcss.config.js
              - .eslintrc.cjs
            backend:
              - *shared
              - backend/**
              # frontend sources feed include_str! in main.rs, so a frontend change must also rebuild the backend
              - src/**
              - public/**
              - index.html
              - package.json
              - package-lock.json
              - vite.config.ts

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make lint typecheck test-fe build-fe

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: make build-fe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - run: make fmt-check clippy test-be
