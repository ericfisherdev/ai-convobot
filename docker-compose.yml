version: '3.8'

services:
  # CPU-only version
  ai-companion-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models:ro
      - data:/app/data
    environment:
      - RUST_LOG=info
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=3000
      - COMPANION_DATA_DIR=/app/data
    restart: unless-stopped
    profiles:
      - cpu

  # CUDA version (requires NVIDIA Docker)
  ai-companion-cuda:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models:ro
      - data:/app/data
    environment:
      - RUST_LOG=info
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=3000
      - COMPANION_DATA_DIR=/app/data
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    profiles:
      - cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Alternative CUDA service using pre-built image (if available)
  ai-companion-cuda-prebuilt:
    image: ${DOCKER_USERNAME:-ericfisherdev}/ai-companion:latest-cuda
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models:ro
      - data:/app/data
    environment:
      - RUST_LOG=info
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=3000
      - COMPANION_DATA_DIR=/app/data
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    profiles:
      - prebuilt-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU pre-built image
  ai-companion-cpu-prebuilt:
    image: ${DOCKER_USERNAME:-ericfisherdev}/ai-companion:latest-cpu
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models:ro
      - data:/app/data
    environment:
      - RUST_LOG=info
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=3000
      - COMPANION_DATA_DIR=/app/data
    restart: unless-stopped
    profiles:
      - prebuilt-cpu

  # Joiner: a second instance that connects to ai-companion-cpu as a
  # multi-instance chat participant (see DEPLOYMENT.md's "Multi-instance
  # chat" section). It needs its own model, and its multiplayer role is
  # configured in its own Settings dialog, not via env vars: set mode
  # `joiner`, host address `ai-companion-cpu:3000` (the host's service
  # name and *container* port, not the published 3000), and a participant
  # id and password matching the host — do that at http://localhost:3001.
  ai-companion-joiner:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "3001:3000"
    volumes:
      - ./models:/app/models:ro
      - joiner-data:/app/data
    environment:
      - RUST_LOG=info
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=3000
      - COMPANION_DATA_DIR=/app/data
    depends_on:
      # Not `service_healthy`: the CPU image's HEALTHCHECK runs `curl`,
      # which the runtime stage does not install (#93), so a health
      # condition here would never become healthy.
      ai-companion-cpu:
        condition: service_started
    restart: unless-stopped
    profiles:
      - multiplayer

volumes:
  models:
    driver: local
  data:
    driver: local
  joiner-data:
    driver: local
